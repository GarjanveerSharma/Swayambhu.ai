server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_buffering off;          # streaming ke liye zaroori
    proxy_cache off;
    proxy_read_timeout 600s;
  }

  location / {
    try_files $uri /index.html;   # React Router ke liye
  }
}
